    <rect x="16" y="146" width="80"  height="8"  rx="4" fill="#ffffff" fill-opacity="0.1"/>
    <rect x="16" y="166" width="48"  height="40" rx="8" fill="#ffffff" fill-opacity="0.07"/>
    <rect x="70" y="166" width="48"  height="40" rx="8" fill="#ffffff" fill-opacity="0.07"/>
    <rect x="44" y="218" width="46"  height="4"  rx="2" fill="#ffffff" fill-opacity="0.35"/>
