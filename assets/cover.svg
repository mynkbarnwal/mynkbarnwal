    <text x="78" y="196" font-size="72" font-weight="700" fill="#F4F4F6" letter-spacing="-1.5">Mayank Barnwal</text>
    <rect x="80" y="222" width="72" height="4" rx="2" fill="url(#accent)"/>
    <text x="80" y="268" font-size="26" fill="#C9CAD3">Senior Mobile &amp; Full-stack Engineer <tspan fill="#6E7080">·</tspan> 13+ years</text>

    <g font-size="16" fill="#D8D9E0">
      <rect x="80"  y="300" width="132" height="36" rx="18" fill="#ffffff" fill-opacity="0.04" stroke="#ffffff" stroke-opacity="0.14"/>
      <text x="146" y="323" text-anchor="middle">Swift · SwiftUI</text>
      <rect x="224" y="300" width="88"  height="36" rx="18" fill="#ffffff" fill-opacity="0.04" stroke="#ffffff" stroke-opacity="0.14"/>
      <text x="268" y="323" text-anchor="middle">Flutter</text>
      <rect x="324" y="300" width="112" height="36" rx="18" fill="#ffffff" fill-opacity="0.04" stroke="#ffffff" stroke-opacity="0.14"/>
      <text x="380" y="323" text-anchor="middle">TypeScript</text>
      <rect x="448" y="300" width="112" height="36" rx="18" fill="#ffffff" fill-opacity="0.04" stroke="#ffffff" stroke-opacity="0.14"/>
      <text x="504" y="323" text-anchor="middle">Vue · Nuxt</text>
      <rect x="572" y="300" width="96"  height="36" rx="18" fill="#ffffff" fill-opacity="0.04" stroke="#ffffff" stroke-opacity="0.14"/>
      <text x="620" y="323" text-anchor="middle">Node.js</text>
      <rect x="680" y="300" width="168" height="36" rx="18" fill="#ffffff" fill-opacity="0.04" stroke="#ffffff" stroke-opacity="0.14"/>
      <text x="764" y="323" text-anchor="middle">Supabase · Postgres</text>
    </g>
  </g>

  <!-- browser window (web) -->
