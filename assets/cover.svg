    <path d="M0 14 a14 14 0 0 1 14 -14 h272 a14 14 0 0 1 14 14 v20 h-300z" fill="#2e2f3d"/>
    <circle cx="20" cy="17" r="5" fill="#FF5F57"/>
    <circle cx="38" cy="17" r="5" fill="#FEBC2E"/>
    <circle cx="56" cy="17" r="5" fill="#28C840"/>
    <rect x="20" y="54"  width="120" height="10" rx="5" fill="#ffffff" fill-opacity="0.18"/>
    <rect x="20" y="76"  width="180" height="8"  rx="4" fill="#ffffff" fill-opacity="0.08"/>
    <rect x="20" y="92"  width="150" height="8"  rx="4" fill="#ffffff" fill-opacity="0.08"/>
    <rect x="20" y="118" width="80"  height="52" rx="8" fill="#ffffff" fill-opacity="0.06"/>
    <rect x="110" y="118" width="80" height="52" rx="8" fill="#ffffff" fill-opacity="0.06"/>
