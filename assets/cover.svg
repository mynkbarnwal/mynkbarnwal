<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="420" viewBox="0 0 1280 420" role="img" aria-labelledby="t d">
  <title id="t">Mayank Barnwal</title>
  <desc id="d">Senior Mobile and Full-stack Engineer, 13+ years. iOS, Flutter, web and backend.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#23242f"/>
      <stop offset="1" stop-color="#16171e"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FA7343"/>
      <stop offset="1" stop-color="#F5A35C"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.8" cy="0.45" r="0.45">
      <stop offset="0" stop-color="#FA7343" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#FA7343" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2" fill="#ffffff" fill-opacity="0.05"/>
    </pattern>
  </defs>

  <rect width="1280" height="420" fill="url(#bg)"/>
  <rect width="1280" height="420" fill="url(#dots)"/>
  <rect width="1280" height="420" fill="url(#glow)"/>

  <g font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Helvetica, Arial, sans-serif">
